      // ----------------------------------------------------------------
      // Interactions
      // ----------------------------------------------------------------
      function bindOnce(selector, bind) {
        document.querySelectorAll(`${selector}:not([data-bound])`).forEach((node) => {
          node.dataset.bound = "";
          bind(node);
        });
      }

      function bindInteractions() {
        bindOnce("[data-mode]", (button) => {
          button.addEventListener("click", () => {
            state.mode = button.dataset.mode;
            renderViewer();
          });
        });

        bindOnce("[data-view]", (button) => {
          button.addEventListener("click", () => {
            if (button.disabled) return;
            state.mode = "display";
            state.view = button.dataset.view;
            state.hover = null;
            state.hoverX = null;
            renderViewer();
          });
        });

        bindOnce("[data-variable-path]", (button) => {
          button.addEventListener("click", () => {
            stopPlayback();
            state.variable = button.dataset.variablePath;
            state.hover = null;
            state.hoverX = null;
            if (!hasTime()) {
              state.view = "field";
              state.time = 0;
            }
            if (state.scale === "log" && colorDomain()[0] <= 0) state.scale = "linear";
            if (state.probe) setProbe(state.probe.fx, state.probe.fy);
            state.message = "mock selection changed · no network request";
            renderViewer();
          });
        });

        bindOnce("[data-time]", (input) => {
          input.addEventListener("input", () => {
            stopPlayback();
            setTime(Number(input.value));
          });
        });

        bindOnce("[data-level]", (input) => {
          input.addEventListener("input", () => {
            state.level = Number(input.value);
            document.querySelectorAll("[data-level-output]").forEach((o) => { o.textContent = state.level; });
            scheduleDraw();
          });
        });

        bindOnce("[data-map]", (select) => {
          select.addEventListener("change", () => {
            state.map = select.value;
            state.message = state.map === "none" ? "map overlay off" : "OSM-derived CARTO Positron overlay";
            renderViewer();
          });
        });

        bindOnce("[data-cmap]", (select) => {
          select.addEventListener("change", () => {
            state.cmap = select.value || null;
            state.message = state.cmap === "balance" && !currentVariable().zeroMeaningful
              ? "balance is diverging: only use it where zero is a real reference"
              : `colormap ${resolvedCmap()}`;
            setMessage(state.message);
            if (state.probe) setProbe(state.probe.fx, state.probe.fy);
            scheduleDraw();
          });
        });

        bindOnce("[data-scale]", (select) => {
          select.addEventListener("change", () => {
            state.scale = select.value;
            state.message = `${state.scale} colour transform · browser-side only`;
            const subtitle = document.querySelector('[data-plot-frame][data-kind="field"]')?.closest(".figure")?.querySelector(".figure-subtitle");
            if (subtitle) subtitle.innerHTML = fieldSubtitle();
            setMessage(state.message);
            scheduleDraw();
          });
        });

        bindOnce("[data-action]", (button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.action;
            if (action === "first") { stopPlayback(); setTime(0); return; }
            if (action === "last") { stopPlayback(); setTime(TIME_LENGTH - 1); return; }
            if (action === "reverse") { startPlayback(-1); return; }
            if (action === "step-back") { stopPlayback(); setTime(state.time - 1); return; }
            if (action === "stop") { stopPlayback(); return; }
            if (action === "step-forward") { stopPlayback(); setTime(state.time + 1); return; }
            if (action === "forward") { startPlayback(1); return; }

            if (action === "sidebar") {
              state.sidebar = !state.sidebar;
              const shell = document.querySelector(".shell");
              if (shell) shell.dataset.sidebar = state.sidebar ? "open" : "closed";
              button.setAttribute("aria-expanded", state.sidebar);
              return;
            } else if (action === "reset") {
              stopPlayback();
              state.time = 99;
              state.level = 4;
              state.cmap = null;
              state.scale = "linear";
              state.hover = null;
              state.hoverX = null;
              state.message = "view reset";
            } else if (action === "png") {
              setMessage("PNG capture would download here");
              return;
            } else if (action === "fullscreen") {
              setMessage("fullscreen control placement confirmed");
              return;
            }
            playbackPosition = state.time;
            renderViewer();
          });
        });

        bindOnce("[data-tree-filter]", (input) => {
          input.addEventListener("input", () => {
            const needle = input.value.trim().toLowerCase();
            let visible = 0;
            document.querySelectorAll("[data-search]").forEach((item) => {
              const match = needle === "" || item.dataset.search.includes(needle);
              item.hidden = !match;
              if (match) visible += 1;
            });
            document.querySelectorAll("[data-group]").forEach((group) => {
              const items = [...document.querySelectorAll(`[data-variable-path^="/${group.dataset.group}/"]`)];
              group.hidden = needle !== "" && (items.length === 0 || items.every((i) => i.hidden));
            });
            const empty = document.querySelector("[data-tree-empty]");
            if (empty) empty.hidden = visible > 0;
          });
        });

        bindSidebarGrip();
        bindFieldProbe();
        bindCurvePointer();
      }

      function bindSidebarGrip() {
        bindOnce("[data-sidebar-grip]", (grip) => {
          const shell = grip.closest(".shell");
          const setWidth = (width) => {
            state.sidebarWidth = clamp(width, 170, 460);
            shell.style.setProperty("--sidebar-w", `${state.sidebarWidth}px`);
          };
          grip.addEventListener("pointerdown", (event) => {
            event.preventDefault();
            grip.setPointerCapture(event.pointerId);
            const startX = event.clientX;
            const startWidth = state.sidebarWidth;
            const move = (moveEvent) => setWidth(startWidth + moveEvent.clientX - startX);
            const up = () => {
              grip.removeEventListener("pointermove", move);
              grip.removeEventListener("pointerup", up);
              grip.removeEventListener("pointercancel", up);
            };
            grip.addEventListener("pointermove", move);
            grip.addEventListener("pointerup", up);
            grip.addEventListener("pointercancel", up);
          });
          grip.addEventListener("keydown", (event) => {
            const delta = event.key === "ArrowLeft" ? -16 : event.key === "ArrowRight" ? 16 : 0;
            if (!delta) return;
            event.preventDefault();
            setWidth(state.sidebarWidth + delta);
          });
        });
      }

      function bindFieldProbe() {
        bindOnce("[data-field-canvas]", (canvas) => {
          const probeFrom = (event) => {
            const bounds = canvas.getBoundingClientRect();
            if (bounds.width < 2 || bounds.height < 2) return;
            setProbe((event.clientX - bounds.left) / bounds.width, (event.clientY - bounds.top) / bounds.height);
          };
          canvas.addEventListener("pointermove", probeFrom);
          canvas.addEventListener("click", probeFrom);
        });
      }

      /**
       * Bound on the frame, not on the SVG: the SVG is rebuilt on every draw,
       * so a handler attached to its children would not survive a resize.
       */
      function bindCurvePointer() {
        bindOnce('[data-plot-frame][data-kind="curve"]', (frame) => {
          const svg = frame.querySelector("[data-plot-svg]");
          const pointFrom = (event) => {
            const g = svg._geometry;
            if (!g) return null;
            const bounds = frame.getBoundingClientRect();
            const x = event.clientX - bounds.left;
            const y = event.clientY - bounds.top;
            if (x < g.x0 - 6 || x > g.x1 + 6 || y < g.y0 - 6 || y > g.y1 + 6) return null;
            return { index: g.indexAt(x), x: clamp(x, g.x0, g.x1) };
          };
          frame.addEventListener("pointermove", (event) => {
            const point = pointFrom(event);
            state.hover = point && point.index;
            state.hoverX = point && point.x;
            if (!point) clearCurveHover(svg);
            else drawCurveHover(svg, point.index, point.x);
          });
          frame.addEventListener("pointerleave", () => {
            state.hover = null;
            state.hoverX = null;
            clearCurveHover(svg);
          });
          frame.addEventListener("click", (event) => {
            const point = pointFrom(event);
            if (!point) return;
            stopPlayback();
            setTime(point.index);
          });
        });
      }

      // ----------------------------------------------------------------
      // Global
      // ----------------------------------------------------------------
      addEventListener("keydown", (event) => {
        const target = event.target;
        const tag = target instanceof HTMLElement ? target.tagName : "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (target && target.isContentEditable)) return;
        if (!hasTime()) return;
        const jump = event.shiftKey ? 12 : 1;
        if (event.key === "ArrowLeft") { stopPlayback(); setTime(state.time - jump); }
        else if (event.key === "ArrowRight") { stopPlayback(); setTime(state.time + jump); }
        else if (event.key === "Home") { stopPlayback(); setTime(0); }
        else if (event.key === "End") { stopPlayback(); setTime(TIME_LENGTH - 1); }
        else if (event.key === " ") { if (state.playDirection === 0) startPlayback(1); else stopPlayback(); }
        else return;
        event.preventDefault();
      });

      if (typeof ResizeObserver === "undefined") addEventListener("resize", scheduleDraw);
      addEventListener("pagehide", stopPlayback);
      // A hidden tab still runs rAF in some browsers; stop burning frames.
      document.addEventListener("visibilitychange", () => { if (document.hidden) stopPlayback(); });

      console.assert(
        timestampLabel(0, VARIABLES["/ocean/temperature"]) === "2024-07-25 00:00 HKT" &&
          Math.abs(niceStep(0.31) - 0.5) < 1e-12 &&
          formatTick(-0.0, 0.5) === "0.0" &&
          colorDomain(VARIABLES["/wind/u10"])[0] === -colorDomain(VARIABLES["/wind/u10"])[1] &&
          resolvedCmap(VARIABLES["/bathymetry/depth"]) === "depth" &&
          colorDomain(VARIABLES["/bathymetry/depth"])[0] === 0 &&
          Math.abs(fieldAspect() - 1.605) < 0.01 &&
          mapTileMarkup().includes("/light_all/7/"),
        "time, tick, colour-domain, projection and map invariants must hold",
      );

      render();
    </script>
  </body>
</html>
